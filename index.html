<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>부산의료원 | 건강 캠페인 디자인 아카이브</title><style>
:root{--ink:#193d47;--accent:#247c89;--bg:#f5f9f8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Pretendard,'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--ink)}.hero{background:linear-gradient(120deg,#e1f3f2,#bce5e4);padding:74px max(24px,calc((100vw - 1120px)/2)) 76px;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;width:270px;height:270px;border:42px solid rgba(255,255,255,.23);border-radius:50%;right:7%;top:-150px}.eyebrow{font-size:12px;letter-spacing:.22em;font-weight:800;color:#207788}.hero h1{font-size:clamp(36px,5vw,68px);letter-spacing:-.065em;line-height:1.18;margin:22px 0}.hero p{font-size:16px;line-height:1.9;color:#365d63;margin:0}.wrap{max-width:1120px;margin:auto;padding:65px 24px 95px}.section-head{margin-bottom:32px}.section-head h2{font-size:30px;letter-spacing:-.05em;margin:9px 0 10px}.section-head p{color:#69828a;font-size:14px;line-height:1.8;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}.card{background:white;border:1px solid #e3eded;border-radius:15px;overflow:hidden;cursor:pointer;text-align:left;padding:0;color:inherit;box-shadow:0 6px 24px rgba(24,64,70,.045);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(24,64,70,.12)}.stage{height:265px;background:#e9f2f2;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:20px}.stage.poster{background:linear-gradient(145deg,#dbe8e8,#f5f8f7)}.poster img{height:90%;max-width:85%;object-fit:contain;box-shadow:9px 12px 17px #233b3e30;border:5px solid white}.stage.xbanner{background:linear-gradient(160deg,#e8f1f0,#d6e4e3)}.xbanner img{height:89%;max-width:90%;object-fit:contain;filter:drop-shadow(8px 10px 5px #203b3b26)}.xbanner:after{content:'';position:absolute;bottom:9px;width:100px;height:5px;border-radius:50%;background:#42666b30;filter:blur(3px)}.stage.leaflet img{width:95%;object-fit:contain;box-shadow:7px 10px 16px #28484b25;transform:rotate(-2deg)}.stage.web img{width:94%;box-shadow:6px 9px 18px #28484b20;border:7px solid white}.info{padding:21px 22px 24px}.info small{font-size:11px;letter-spacing:.1em;color:#368b96;font-weight:800}.info h3{font-size:18px;margin:9px 0 8px;letter-spacing:-.035em}.info p{font-size:13px;color:#789095;margin:0}.footer{text-align:center;padding:32px;color:#8ca3a7;font-size:12px;border-top:1px solid #e3eded}.modal{position:fixed;inset:0;background:rgba(9,25,31,.91);z-index:30;display:none;align-items:center;justify-content:center;padding:65px 70px 55px}.modal.open{display:flex}.modal img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 10px 45px #0005}.close,.arrow{position:absolute;background:#ffffff20;border:1px solid #ffffff40;color:white;cursor:pointer;font-size:24px;display:grid;place-items:center}.close{right:23px;top:20px;width:42px;height:42px}.arrow{top:50%;transform:translateY(-50%);width:44px;height:60px}.prev{left:13px}.next{right:13px}.count{position:absolute;bottom:16px;color:#cbd9da;font-size:12px;letter-spacing:.1em}.modal-title{position:absolute;top:24px;left:28px;color:white;font-size:14px;font-weight:700}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:65px 24px}.stage{height:240px}}@media(max-width:560px){.grid{grid-template-columns:1fr;gap:18px}.wrap{padding:45px 18px}.hero{padding:58px 20px}.hero h1{font-size:39px}.stage{height:265px}.modal{padding:70px 12px}.arrow{width:36px;height:48px;top:auto;bottom:12px;transform:none}.prev{left:20px}.next{right:20px}.count{bottom:27px}}
.stage.cardnews{background:linear-gradient(145deg,#e9eeee,#dce8e8);perspective:900px}.cardnews-stack{width:55%;height:88%;position:relative;transform:rotate(-5deg);filter:drop-shadow(10px 14px 10px #193d4730)}.cardnews-stack img{position:absolute;width:100%;height:100%;object-fit:cover;border:5px solid #fff;border-radius:5px;box-shadow:0 5px 14px #193d472b}.cardnews-stack img:nth-child(1){transform:translate(16px,-10px) rotate(10deg)}.cardnews-stack img:nth-child(2){transform:translate(-8px,3px) rotate(-5deg)}.cardnews-stack img:nth-child(3){transform:translate(0,0)}.cardnews .slide-label{position:absolute;right:14px;bottom:12px;background:#fff;color:#247c89;padding:6px 10px;border-radius:30px;font-size:11px;font-weight:800}.modal .slide-caption{position:absolute;bottom:35px;color:#e4eded;font-size:12px}.modal img{min-width:0}@media(max-width:560px){.modal .slide-caption{bottom:80px}} </style></head><body><header class="hero"><div class="eyebrow">BUSAN MEDICAL CENTER · DESIGN ARCHIVE</div><h1>건강한 오늘,<br>더 나은 내일.</h1><p>건강검진부터 건강교육까지.<br>부산의료원 건강 캠페인 디자인 프로젝트 아카이브</p></header><main class="wrap"><div class="section-head"><div class="eyebrow">CAMPAIGN DESIGN</div><h2>프로젝트 작품 보기</h2><p>작품을 클릭하면 원본 디자인을 크게 볼 수 있습니다. 좌우 화살표로 다른 작품도 감상해 보세요.<br>썸네일에는 인쇄물의 느낌을 살린 간단한 목업 효과를 적용했습니다.</p></div><div class="grid" id="gallery"></div></main><footer class="footer">BUSAN MEDICAL CENTER · STUDENT DESIGN PROJECT</footer><div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="작품 크게 보기"><span class="modal-title" id="modalTitle"></span><button class="close" id="close" aria-label="닫기">×</button><button class="arrow prev" id="prev" aria-label="이전 작품">‹</button><img id="large" alt=""><button class="arrow next" id="next" aria-label="다음 작품">›</button><div class="slide-caption" id="slideCaption"></div><div class="count" id="count"></div></div><script>
const works=[{title:'건강검진 포스터',type:'POSTER',kind:'poster',desc:'국가건강검진 홍보 포스터'},{title:'건강교실 포스터',type:'POSTER',kind:'poster',desc:'건강교육 프로그램 안내'},{title:'금연캠프 X배너',type:'X-BANNER',kind:'xbanner',desc:'4박 5일 금연캠프 홍보'},{title:'건강검진 리플릿',type:'LEAFLET',kind:'leaflet',desc:'부산의료원 건강검진 안내 리플릿'},{title:'건강검진 X배너',type:'X-BANNER',kind:'xbanner',desc:'국가건강검진 대상자 안내'},{title:'건강검진 웹배너',type:'WEB BANNER',kind:'web',desc:'2026년 국가건강검진 온라인 홍보'},{title:'금연캠프 카드뉴스',type:'CARD NEWS · 8 SLIDES',kind:'cardnews',desc:'금연캠프 소개부터 참여 안내까지 · 8장',slides:8}];
let current=0,slide=0;const gallery=document.getElementById('gallery'),modal=document.getElementById('modal'),large=document.getElementById('large');
works.forEach((w,i)=>{const btn=document.createElement('button');btn.className='card';let visual=w.kind==='cardnews'?'<div class="cardnews-stack"><img src="images/cardnews3.jpg" alt="" loading="lazy"><img src="images/cardnews2.jpg" alt="" loading="lazy"><img src="images/cardnews1.jpg" alt="금연캠프 카드뉴스 표지" loading="lazy"></div><span class="slide-label">8 SLIDES</span>':`<img src="images/work${i+1}.jpg" alt="${w.title}" loading="lazy">`;btn.innerHTML=`<div class="stage ${w.kind}">${visual}</div><div class="info"><small>${w.type}</small><h3>${w.title}</h3><p>${w.desc}</p></div>`;btn.addEventListener('click',()=>show(i,0));gallery.append(btn)});
function show(i,s=0){current=(i+works.length)%works.length;const w=works[current];slide=Math.max(0,Math.min(s,(w.slides||1)-1));large.src=w.kind==='cardnews'?`images/cardnews${slide+1}.jpg`:`images/work${current+1}.jpg`;large.alt=w.title+(w.slides?` ${slide+1}페이지`:'');document.getElementById('modalTitle').textContent=w.title;document.getElementById('slideCaption').textContent=w.slides?'좌우 화살표로 카드뉴스 8장을 넘겨보세요':'';document.getElementById('count').textContent=w.slides?`${slide+1} / ${w.slides} · 카드뉴스`:`${current+1} / ${works.length}`;modal.classList.add('open');document.body.style.overflow='hidden'}
function move(dir){const w=works[current];if(w.slides){if(slide+dir>=0&&slide+dir<w.slides){show(current,slide+dir);return}show((current+dir+works.length)%works.length,dir<0?(works[(current+dir+works.length)%works.length].slides||1)-1:0)}else{const next=(current+dir+works.length)%works.length;show(next,dir<0?(works[next].slides||1)-1:0)}}
function close(){modal.classList.remove('open');document.body.style.overflow=''}document.getElementById('close').onclick=close;document.getElementById('prev').onclick=()=>move(-1);document.getElementById('next').onclick=()=>move(1);modal.addEventListener('click',e=>{if(e.target===modal)close()});document.addEventListener('keydown',e=>{if(!modal.classList.contains('open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')move(-1);if(e.key==='ArrowRight')move(1)});
</script></body></html>
